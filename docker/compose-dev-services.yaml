name: manta

services:
  postgres:
    image: postgres:17-alpine
    env_file: ../backend/.env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.05
    # "mini" runs master+volume+filer+S3 gateway+WebDAV+Admin UI in one
    # process, with defaults auto-tuned for dev/small-scale use — SeaweedFS's
    # own purpose-built command for local S3-compatible storage.
    command:
      - mini
      - -ip.bind=0.0.0.0
      - -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "${S3_PORT}:8333"
      - "${SEAWEEDFS_ADMIN_PORT}:23646" # Admin UI — cluster status, bucket/object browser
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command:
      - start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB_USERNAME: "${KC_DB_USERNAME}"
      KC_DB_PASSWORD: "${KC_DB_PASSWORD}"
      KC_DB_PORT: 5432
      KC_HOSTNAME: localhost
    ports:
      - '8080:8080'
    volumes:
      - ./conf/user_profile.json:/tmp/user_profile.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    post_start:
      # Wait for keycloak initialization to finish
      - command: ["bash", "-c", "until /opt/keycloak/bin/kcadm.sh config credentials --server http://localhost:8080/ --realm master --user admin --password admin; do\n echo Waiting for Keycloak to start...\n sleep 2\n done"]
      # Create manta authentication realm
      - command: ["/opt/keycloak/bin/kcadm.sh", "create", "realms", "-s", "realm=${KEYCLOAK_REALM}", "-s", "enabled=true"]
      # Set user profile to require user name and email only
      - command: ["/opt/keycloak/bin/kcadm.sh", "update", "users/profile", "-r", "${KEYCLOAK_REALM}", "-f", "/tmp/user_profile.json"]
      # Create client for manta (as a resource provider) to use
      - command:
        - /opt/keycloak/bin/kcadm.sh
        - create
        - clients
        - "-r"
        - "${KEYCLOAK_REALM}"
        - "-s"
        - "clientId=${MANTA_CLIENT_ID}"
        - "-s"
        - "secret=${MANTA_CLIENT_SECRET}"
        - "-s"
        - "clientAuthenticatorType=client-secret"
        - "-s"
        - "publicClient=false"
        - "-s"
        - "protocol=openid-connect"
        - "-s"
        - "enabled=true"
      # create an admin user (used for the dev server to programmatically register new user accounts)
      - command:
        - /opt/keycloak/bin/kcadm.sh
        - create
        - users
        - "-r"
        - master
        - "-s"
        - "username=kcadmin"
        - "-s"
        - "email=super-admin@example.com"
        - "-s"
        - "emailVerified=true"
        - "-s"
        - "enabled=true"
      # add password for admin user
      - command:
        - /opt/keycloak/bin/kcadm.sh
        - set-password
        - "-r"
        - master
        - "--username"
        - "kcadmin"
        - "--new-password"
        - "kcpassword"
      # make admin an admin
      - command:
        - /opt/keycloak/bin/kcadm.sh
        - add-roles
        - "--uusername"
        - kcadmin
        - "--rolename"
        - admin


volumes:
  postgres-data:
  seaweedfs-data:
  keycloak-data:
