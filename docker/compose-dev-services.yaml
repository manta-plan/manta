name: manta

services:
  postgres:
    image: postgres:17-alpine
    env_file: ../backend/.env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./conf/postgres-init:/docker-entrypoint-initdb.d:ro
    # The prefect database also has to exist before this container counts as
    # healthy — prefect-server waits on `service_healthy`, and post_start (which
    # creates the database, see below) gives no such ordering guarantee itself.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} && psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tc \"SELECT 1 FROM pg_database WHERE datname = 'prefect'\" | grep -q 1",
        ]
      interval: 2s
      timeout: 2s
      retries: 20
    post_start:
      # Create the prefect-server database if it's missing. Runs on every start
      # (idempotent) rather than as an initdb script, so existing dev volumes
      # created before this database was needed get it too.
      - command:
          [
            "sh",
            "-c",
            "until pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}; do sleep 1; done; psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -tc \"SELECT 1 FROM pg_database WHERE datname = 'prefect'\" | grep -q 1 || createdb -U ${POSTGRES_USER} prefect",
          ]

  seaweedfs:
    image: chrislusf/seaweedfs:4.05
    # "mini" runs master+volume+filer+S3 gateway+WebDAV+Admin UI in one
    # process, with defaults auto-tuned for dev/small-scale use — SeaweedFS's
    # own purpose-built command for local S3-compatible storage.
    command:
      - mini
      - -ip.bind=0.0.0.0
      - -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "${S3_PORT}:8333"
      - "${SEAWEEDFS_ADMIN_PORT}:23646" # Admin UI — cluster status, bucket/object browser
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3.8.3-python3.12
    command: prefect server start --host 0.0.0.0
    env_file: ../backend/.env
    environment:
      # Prefect's default store is a SQLite file, which buckles under concurrent
      # writers ("database is locked" errors) as soon as workers poll the server —
      # so state lives in the shared Postgres instead, in its own database
      # (created by the postgres service's post_start above).
      PREFECT_SERVER_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/prefect
    ports:
      - "${PREFECT_PORT}:4200"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # `curl` isn't installed in this image — so using `python` instead
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Playbook execution ---------------------------------------------------
  # Gated behind `--profile playbooks` so the base stack (and the integration
  # test suite, which includes this file wholesale) stays lean; the worker image
  # bakes two pixi environments and is a heavyweight build. Start it with:
  #   docker compose --env-file ../backend/.env -f compose-dev-services.yaml --profile playbooks up
  #
  # Work pools are docker-type: every job - each playbook run and each block
  # run - executes in its own throwaway container, spawned from the image below
  # (docker/worker.Dockerfile) with the pool's pixi environment activated. The
  # workers here are thin dispatchers: they drain a pool and talk to the docker
  # daemon, nothing more. All job wiring (image, network, volumes, environment)
  # lives in the pools' job templates, written by playbooks-provision.

  # One-shot: creates the docker work pools (job templates included) and
  # registers a Prefect deployment per block plus the playbook orchestrator.
  # Idempotent - templates and deployments are created or updated on every `up`,
  # which is also how image/env changes roll out. The backend only ever starts
  # runs on deployments this container has registered.
  playbooks-provision:
    profiles: ["playbooks"]
    build:
      context: ..
      dockerfile: docker/control.Dockerfile
    image: manta-playbooks-control
    command: python /app/provision.py
    restart: "no"
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      # What every job container runs as and plugs into. The network and volume
      # names are the ones this compose project produces ("manta" + resource).
      MANTA_JOB_IMAGE: manta-playbooks-job
      MANTA_JOB_NETWORK: manta_default
      MANTA_JOB_VOLUMES: manta_prefect-results:/prefect-results
      # The block library job containers serve. Named MANTA_JOB_* rather than
      # MANTA_BLOCK_SOURCES because manta_blocks imports the libraries that
      # variable names on import — which this container cannot do, having no
      # pixi and no PyPSA.
      MANTA_JOB_BLOCK_SOURCES: manta_batteries
      # Handed on to every job container: where records live
      # (boto3's standard variables, read by manta_blocks.records).
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_ENDPOINT_URL: http://seaweedfs:8333
    volumes:
      # Read rather than generated: building it needs every block importable.
      # Regenerate with `pixi run -e pypsa catalogue` after changing a block.
      - ../manta-batteries/catalogue.json:/catalogue.json:ro
    depends_on:
      prefect-server:
        condition: service_healthy

  # Runs `run_playbook` itself, in-process, on a process pool: a playbook run
  # waits out every one of its steps, so a container per run would idle for
  # hours and take the run down with it if it were evicted. It moves record
  # pointers between steps and never reads the data, so it needs no S3
  # credentials. Also the service that builds the job image.
  prefect-worker-orchestrator:
    profiles: ["playbooks"]
    build:
      context: ..
      dockerfile: docker/job.Dockerfile
    image: manta-playbooks-job
    command: pixi run -e orchestrator prefect worker start --pool manta-orchestrator
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_LOCAL_STORAGE_PATH: /prefect-results
    volumes:
      # Persisted flow results (the record pointers blocks return) go on a
      # volume shared with every job container, so the orchestrator can read a
      # block's result back. Object-store result storage would remove it, at
      # the price of an s3fs dependency everywhere.
      - prefect-results:/prefect-results
    depends_on:
      prefect-server:
        condition: service_healthy
      playbooks-provision:
        condition: service_completed_successfully

  # A dispatcher, not an execution environment: it drains the pypsa pool and
  # asks the docker daemon to run each block in a fresh job-image container.
  prefect-worker-pypsa:
    profiles: ["playbooks"]
    build:
      context: ..
      dockerfile: docker/control.Dockerfile
    image: manta-playbooks-control
    command: prefect worker start --pool manta-pypsa --type docker
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      # Jobs are *sibling* containers on the host's daemon, not nested ones.
      # Socket access is root-equivalent control of the host's docker;
      # acceptable for this dev stack only.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      prefect-server:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      playbooks-provision:
        condition: service_completed_successfully

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command:
      - start-dev
      # This option causes startup to attempt to import a realm from the
      # /opt/keycloak/data/import directory in the container. If the realm
      # already exists, it skips it, preserving state
      #
      # We can use kcadm on a live instance of keycloak to re-export the realm
      # if we wish to update base state.
      # see: https://www.keycloak.org/server/importExport
      - --import-realm
    env_file: ../backend/.env
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB_URL_PORT: 5432
      KC_HOSTNAME: localhost
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./conf/user_profile.json:/tmp/user_profile.json:ro
      - ./conf/manta-realm.json:/opt/keycloak/data/import/manta-realm.json:ro
    healthcheck:
      # No curl/wget/nc in this image — /dev/tcp is the only thing available.
      # the default management interface for Keycloak is port 9000
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          echo -e "GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          cat <&3 | grep -q "200 OK"
      interval: 2s
      timeout: 2s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
    post_start:
      # Wait for keycloak initialization to finish
      - command:
          [
            "bash",
            "-c",
            "until /opt/keycloak/bin/kcadm.sh config credentials --server http://localhost:8080/ --realm master --user admin --password admin; do\n echo Waiting for Keycloak to start...\n sleep 2\n done",
          ]
      # Set user profile to require user name and email only (idempotently)
      - command:
          [
            "/opt/keycloak/bin/kcadm.sh",
            "update",
            "users/profile",
            "-r",
            "${KEYCLOAK_REALM}",
            "-f",
            "/tmp/user_profile.json",
          ]
      # create an admin user (used for the dev server to programmatically register new user accounts)
      - command:
          [
            "bash",
            "-c",
            "/opt/keycloak/bin/kcadm.sh create users -r master -s username=${KEYCLOAK_ADMIN_USERNAME} -s email=super-admin@example.com -s emailVerified=true -s enabled=true || true",
          ]
      # add password for admin user
      - command:
          - /opt/keycloak/bin/kcadm.sh
          - set-password
          - "-r"
          - master
          - "--username"
          - "${KEYCLOAK_ADMIN_USERNAME}"
          - "--new-password"
          - "${KEYCLOAK_ADMIN_PASSWORD}"
      # make admin an admin
      - command:
          [
            "bash",
            "-c",
            "/opt/keycloak/bin/kcadm.sh add-roles --uusername ${KEYCLOAK_ADMIN_USERNAME} --rolename admin || true",
          ]

volumes:
  postgres-data:
  seaweedfs-data:
  prefect-results:
