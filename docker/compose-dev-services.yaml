name: manta

services:
  postgres:
    image: postgres:17-alpine
    env_file: ../backend/.env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.05
    # "mini" runs master+volume+filer+S3 gateway+WebDAV+Admin UI in one
    # process, with defaults auto-tuned for dev/small-scale use — SeaweedFS's
    # own purpose-built command for local S3-compatible storage.
    command:
      - mini
      - -ip.bind=0.0.0.0
      - -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "${S3_PORT}:8333"
      - "${SEAWEEDFS_ADMIN_PORT}:23646" # Admin UI — cluster status, bucket/object browser
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command:
      - start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB_USERNAME: "${KC_DB_USERNAME}"
      KC_DB_PASSWORD: "${KC_DB_PASSWORD}"
      KC_DB_PORT: 5432
      KC_HOSTNAME: localhost
    ports:
      - '8080:8080'
    volumes:
      - keycloak-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    post_start:
      # Wait for keycloak initialization to finish
      - command: ["bash", "-c", "until /opt/keycloak/bin/kcadm.sh config credentials --server http://localhost:8080/ --realm master --user admin --password admin; do\n echo Waiting for Keycloak to start...\n sleep 2\n done"]
      - command: ["/opt/keycloak/bin/kcadm.sh", "create", "realms", "-s", "realm=${KEYCLOAK_REALM}", "-s", "enabled=true"]
      #- command: ["/opt/keycloak/bin/kcadm.sh", "create", "-x", "client-scopes", "-r", "${KEYCLOAK_REALM}", "-s", "enabled=true", "-s"]
#      - command:
#        - /opt/keycloak/bin/kcadm.sh
#        - create
#        - "-x"
#        - client-scopes
#        - "-r"
#        - "${KEYCLOAK_REALM}"
#        - "-s"
#        - "name=tenantId"
#        - "-s"
#        - "protocol=openid-connect"
      - command:
        - /opt/keycloak/bin/kcadm.sh
        - create
        - clients
        - "-r"
        - "${KEYCLOAK_REALM}"
        - "-s"
        - "clientId=${MANTA_CLIENT_ID}"
        - "-s"
        - "secret=${MANTA_CLIENT_SECRET}"
        - "-s"
        - "clientAuthenticatorType=client-secret"
        - "-s"
        - "publicClient=false"
        - "-s"
        - "protocol=openid-connect"
        - "-s"
        - "enabled=true"
      #- command: ["/opt/keycloak/bin/kcadm.sh", "create", "clients", "-r", "${KEYCLOAK_REALM}", "-s", "clientId=${MANTA_CLIENT_ID}", "-s", "clientSecret=${MANTA_CLIENT_SECRET}" ,"-s", "enabled=true"]
#    pre_start:
#      # add the keycloak user
#      - command: 'psql -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c "CREATE USER ${KC_DB_USERNAME} WITH PASSWORD ''${KC_DB_PASSWORD}'' CREATEDB;"'
#        user: root
#        privileged: true


volumes:
  postgres-data:
  seaweedfs-data:
  keycloak-data:
