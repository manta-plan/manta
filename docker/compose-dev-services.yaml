name: manta

services:
  postgres:
    image: postgres:17-alpine
    env_file: ../backend/.env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates Keycloak's own database. Runs only on first volume init.
      - ./postgres/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.05
    # "mini" runs master+volume+filer+S3 gateway+WebDAV+Admin UI in one
    # process, with defaults auto-tuned for dev/small-scale use — SeaweedFS's
    # own purpose-built command for local S3-compatible storage.
    command:
      - mini
      - -ip.bind=0.0.0.0
      - -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports:
      - "${S3_PORT}:8333"
      - "${SEAWEEDFS_ADMIN_PORT}:23646" # Admin UI — cluster status, bucket/object browser
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9333/cluster/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    # --import-realm applies docker/keycloak/manta-realm.json during Keycloak's
    # own startup, before it serves traffic. That's why there's no provisioning
    # to orchestrate from out here: the import is idempotent (skipped when the
    # realm already exists), so a restart is a no-op rather than a failure.
    command:
      - start-dev
      - --import-realm
    # Same single source of truth the other services use. Without this, the
    # KC_DB_* settings never reach the container and Keycloak silently falls
    # back to the embedded H2 database.
    env_file: ../backend/.env
    # KC_HOSTNAME is deliberately unset: in start-dev Keycloak then derives the
    # issuer from the request, so the same config works on the dev port and on
    # the ephemeral port the test stack gets (see docker/.env.test).
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./keycloak/manta-realm.json:/opt/keycloak/data/import/manta-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image ships no curl or wget, so use bash's /dev/tcp to hand-write an
      # HTTP request to the health endpoint on the management port (9000).
      # https://www.keycloak.org/observability/health
      test: ["CMD", "bash", "-c", '{ printf ''HEAD /health/ready HTTP/1.0\r\n\r\n'' >&0; grep ''HTTP/1.0 200''; } 0<>/dev/tcp/localhost/9000']
      interval: 5s
      timeout: 5s
      # Keycloak boots in ~20s, far slower than the other services here.
      retries: 20

volumes:
  postgres-data:
  seaweedfs-data:
