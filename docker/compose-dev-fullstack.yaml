# The whole app: the frontend (frontend/Dockerfile) on top of everything in
# compose-dev-backend.yaml (the backend plus every service in
# compose-dev-services.yaml).
#
# To run the frontend on the host instead (`pnpm dev`), stop its container
# first: they share ports.
#
# Image name defaults to a local tag; deploys set MANTA_FRONTEND_IMAGE /
# IMAGE_TAG to pull a prebuilt image from a registry instead.
name: manta

include:
  - compose-dev-backend.yaml

services:
  frontend:
    image: ${MANTA_FRONTEND_IMAGE:-manta-frontend}:${IMAGE_TAG:-latest}
    build:
      context: ../frontend
      # The app reaches the temporary record server through this container's
      # Caddy (same origin, on any host, port or domain), so it needs
      # `--profile temporary-quack-setup`. Its token is baked into the public
      # bundle (see frontend/Dockerfile) and is the server's QUACK_TOKEN.
      args:
        VITE_RECORD_TOKEN: ${QUACK_TOKEN}
      # The repo's git metadata, from which the image reads the commit and
      # date shown in the About dialog (see frontend/Dockerfile).
      additional_contexts:
        git: ../.git
    environment:
      BACKEND_URL: http://backend:8000
      # Container port, not QUACK_SERVER_PORT (that's the host-published one).
      QUACK_URL: http://quack-server:8080
      # Empty or unset: plain HTTP on :80 (local, or behind a load balancer
      # that terminates TLS). A domain name: Caddy gets and renews its own
      # HTTPS certificate, which needs ports 80 and 443 reachable.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${FRONTEND_PORT:-80}:80"
      # Only used when SITE_ADDRESS is a domain.
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      # Caddy's certificates and ACME account: without it every recreate
      # asks Let's Encrypt for a new certificate, and its rate limits bite.
      - caddy-data:/data
    networks:
      default:
        # Fixed, so the backend can trust X-Forwarded-For from this address
        # alone (FORWARDED_ALLOW_IPS in compose-dev-backend.yaml). Outside the
        # network's ip_range (compose-dev-services.yaml), so it's never taken.
        ipv4_address: 172.30.0.2
    depends_on:
      backend:
        condition: service_healthy

volumes:
  caddy-data:
