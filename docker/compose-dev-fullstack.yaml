# The whole app: the frontend (frontend/Dockerfile) on top of everything in
# compose-dev-backend.yaml (the backend plus every service in
# compose-dev-services.yaml).
#
# To run the frontend on the host instead (`pnpm dev`), stop its container
# first: they share ports.
#
# Image name defaults to a local tag; deploys set MANTA_FRONTEND_IMAGE /
# IMAGE_TAG to pull a prebuilt image from a registry instead.
name: manta

include:
  - compose-dev-backend.yaml

services:
  frontend:
    image: ${MANTA_FRONTEND_IMAGE:-manta-frontend}:${IMAGE_TAG:-latest}
    build:
      context: ../frontend
      # The app reaches the temporary record server through this container's
      # Caddy (same origin, on any host, port or domain), so it needs
      # `--profile temporary-quack-setup`. Its token is baked into the public
      # bundle (see frontend/Dockerfile) and is the server's QUACK_TOKEN.
      args:
        VITE_RECORD_TOKEN: ${QUACK_TOKEN}
    environment:
      BACKEND_URL: http://backend:8000
      # Container port, not QUACK_SERVER_PORT (that's the host-published one).
      QUACK_URL: http://quack-server:8080
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
