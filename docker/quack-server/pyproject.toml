[project]
name = "manta-record-server"
version = "0.1.0"
description = "Proof of concept: serve a datarecord to DuckDB-Wasm over the Quack protocol"
requires-python = ">=3.12"
dependencies = [
  "datarecord[remote]==0.1.0a2",
  "duckdb>=2,<3",
  "fastapi>=0.115",
  "httpx>=0.28",
  "uvicorn[standard]>=0.32",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
