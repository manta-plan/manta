name: Backend test

on:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest tests/unit --cov=manta --cov-report=
        env:
          COVERAGE_FILE: .coverage.unit
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: backend/.coverage.unit
          retention-days: 1
          include-hidden-files: true

  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest tests/integration --cov=manta --cov-report=
        env:
          COVERAGE_FILE: .coverage.integration
          # Lets coverage.py's auto-installed .pth hook measure the app
          # subprocess app_server (conftest.py) spawns, not just the test
          # process itself.
          COVERAGE_PROCESS_START: pyproject.toml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: backend/.coverage.integration
          retention-days: 1
          include-hidden-files: true

  coverage:
    needs: [unit, integration]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # diff-cover needs real history to diff against the base branch.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: backend
      - uses: actions/download-artifact@v4
        with:
          name: coverage-integration
          path: backend
      - run: uv run coverage combine .coverage.unit .coverage.integration
      - run: uv run coverage report -m
      - run: uv run coverage xml
      - run: >
          uv run diff-cover coverage.xml
          --compare-branch=origin/${{ github.base_ref }}
          --show-uncovered
          --fail-under=80
