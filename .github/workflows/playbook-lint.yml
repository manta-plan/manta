name: Playbook lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  framework:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playbook
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src
      - run: uv run ruff format --check src

  library:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playbook-library
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          manifest-path: playbook-library/pixi.toml
          # The `dev` environment has no solver stack, so linting stays quick.
          environments: dev
          cache: true
      - run: pixi run -e dev lint
