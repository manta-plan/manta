name: Datarecord session test

on:
  pull_request:

permissions:
  contents: read

jobs:
  datarecord-session:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: datarecord-session
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python -c "import duckdb; c = duckdb.connect(); [c.install_extension(e) for e in ('quack', 'httpfs')]"
      - run: uv run pytest
