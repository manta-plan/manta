name: Frontend lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  oxc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v2
        with:
          runtime: "node@24"
          version: "11.10.0"
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check

  # Separate job, so it can be left out of the required checks if it is too strict.
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v2
        with:
          runtime: "node@24"
          version: "11.10.0"
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
