repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
        # Ruff resolves the nearest pyproject.toml per file, so each package
        # is checked against its own configuration.
        files: ^(backend|manta-blocks|manta-batteries)/
      - id: ruff-format
        files: ^(backend|manta-blocks|manta-batteries)/
