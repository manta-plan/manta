# Ruff discovers the nearest pyproject.toml per file, so each package below is
# checked against its own configuration.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(backend|manta-blocks)/
      - id: ruff-format
        files: ^(backend|manta-blocks)/
