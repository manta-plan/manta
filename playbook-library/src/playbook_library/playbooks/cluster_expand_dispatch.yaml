# yaml-language-server: $schema=../../../../playbook/src/playbook/playbooks/playbook.schema.json

name: cluster-expand-dispatch

initial_data:
  dims: [snapshot]

inputs:
  expansion_mode:
    type: choice
    options: [overnight, myopic]
    default: overnight
    description: How to optimise capacities. Only overnight expansion is dispatched.
  solver_name:
    type: choice
    options: [highs]
    default: highs
    description: The solver that every optimisation of this playbook uses.

steps:
  - id: cluster
    block: cluster_time

  - id: expansion_overnight
    block: overnight_capacity_expansion
    if: ${{ inputs.expansion_mode == 'overnight' }}
    with:
      optimize_config:
        solver_name: ${{ inputs.solver_name }}

  - id: expansion_myopic
    block: myopic_capacity_expansion
    if: ${{ inputs.expansion_mode == 'myopic' }}
    with:
      optimize_config:
        solver_name: ${{ inputs.solver_name }}

  - id: dispatch
    block: rolling_horizon_dispatch
    if: ${{ inputs.expansion_mode == 'overnight' }}
    with:
      optimize_config:
        solver_name: ${{ inputs.solver_name }}
