[project]
name = "datarecord-session"
version = "0.1.0"
description = "A user's datarecord session in a project: one DuckDB with a datarecord workspace, served read-only over Quack."
readme = "README.md"
requires-python = "==3.14.*"
license = "MIT"
dependencies = [
    "datarecord[remote]==0.1.0a2",
    "duckdb>=2,<3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
]

[project.scripts]
datarecord-session = "datarecord_session.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datarecord_session"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "N"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/datarecord_session/{guard,packs,static}.py" = ["S608"]
"tests/**" = ["S101", "S105", "S106", "S608"]
