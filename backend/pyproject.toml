[project]
name = "manta"
version = "0.1.0"
description = "An open-source power systems analyser"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.0",
]

[project.scripts]
manta = "manta.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manta"]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "testcontainers>=4.15.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# A conservative starter set (expand later if needed):
# E = pycodestyle errors, F = pyflakes (unused imports/vars, undefined names),
# I = import sorting, UP = modernize syntax for our pinned Python version,
# B = bugbear (common bug patterns), SIM = simplify needlessly complex code,
# S = bandit security checks (hardcoded secrets, unsafe subprocess/eval usage, ...),
# N = pep8-naming (PascalCase classes, snake_case functions/vars, self/cls, ...).
select = ["E", "F", "I", "UP", "B", "SIM", "S", "N"]
# B008: FastAPI's dependency injection relies on `Depends(...)` as an argument
# default (its own recommended pattern) — not the mutable-default footgun this
# rule is meant to catch.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # bare `assert` is how pytest expresses assertions

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
