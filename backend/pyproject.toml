[project]
name = "manta"
version = "0.1.0"
description = "An open-source power systems analyser"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = []

[project.scripts]
manta = "manta.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manta"]
