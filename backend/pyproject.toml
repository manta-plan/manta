[project]
name = "manta"
version = "0.1.0"
description = "An open-source power systems analyser"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
]

[project.scripts]
manta = "manta.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manta"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# A conservative starter set (expand later if needed):
# E = pycodestyle errors, F = pyflakes (unused imports/vars, undefined names),
# I = import sorting, UP = modernize syntax for our pinned Python version,
# B = bugbear (common bug patterns), SIM = simplify needlessly complex code,
# S = bandit security checks (hardcoded secrets, unsafe subprocess/eval usage, ...),
# N = pep8-naming (PascalCase classes, snake_case functions/vars, self/cls, ...).
select = ["E", "F", "I", "UP", "B", "SIM", "S", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
