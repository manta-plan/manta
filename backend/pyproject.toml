[project]
name = "manta"
version = "0.1.0"
description = "An open-source power systems analyser"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "alembic>=1.18.5",
    "boto3>=1.43.73",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.0",
]

[project.scripts]
manta = "manta.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manta"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.73",
    "diff-cover>=10.5.0",
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.0",
    "testcontainers>=4.15.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# A conservative starter set (expand later if needed):
# E = pycodestyle errors, F = pyflakes (unused imports/vars, undefined names),
# I = import sorting, UP = modernize syntax for our pinned Python version,
# B = bugbear (common bug patterns), SIM = simplify needlessly complex code,
# S = bandit security checks (hardcoded secrets, unsafe subprocess/eval usage, ...),
# N = pep8-naming (PascalCase classes, snake_case functions/vars, self/cls, ...).
select = ["E", "F", "I", "UP", "B", "SIM", "S", "N"]
# B008: the 'function call in default argument' warning is triggered by FastAPI dependency injection's usage of `Depends(...)` as an argument
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # bare `assert` is how pytest expresses assertions

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["manta"]
relative_files = true
parallel = true
# conftest.py stops the app subprocess with SIGTERM; uvicorn's graceful
# shutdown ends by re-raising SIGTERM with the default disposition, which
# kills the process before normal atexit-based coverage saving can run.
# This makes coverage.py install its own SIGTERM handler that saves data
# first, so the subprocess's coverage isn't lost.
sigterm = true
# The integration suite exercises the app through a subprocess (see
# tests/integration/conftest.py), so the pytest process itself never imports
# manta directly.
disable_warnings = ["module-not-imported", "no-data-collected"]
