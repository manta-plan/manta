[project]
name = "manta-runtime"
version = "0.1.0"
description = "Manta's playbook execution runtime: the Prefect flows that run playbooks and the blocks in them."
readme = "README.md"
# Not pinned to the backend's 3.14: this package also runs inside the control
# image, which is built on Prefect's own (3.12) image.
requires-python = ">=3.12"
dependencies = [
    # The playbook engine this runtime walks, and the block catalogue it resolves
    # steps against. Blocks themselves are never imported here.
    "manta-blocks",
    # Pinned to the Prefect server's version: this process talks to its API.
    "prefect==3.8.3",
    # Drives the block containers. Blocks never run in this process; the SDK
    # spawns them from the blocks runner image.
    "docker>=7.1.0",
    "python-dotenv>=1.2.2",
]

[tool.uv.sources]
manta-blocks = { path = "../manta-blocks", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manta_runtime"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Same rules as the backend, minus its FastAPI-specific exception. The lower
# target-version follows requires-python above.
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # bare `assert` is how pytest expresses assertions
