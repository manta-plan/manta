[project]
name = "manta-runtime"
version = "0.1.0"
description = "Manta's playbook execution runtime: the Prefect flows that run playbooks and the blocks in them."
readme = "README.md"
# Not pinned to the backend's 3.14: this package also runs inside the control
# image, which is built on Prefect's own (3.12) image.
requires-python = ">=3.12"
dependencies = [
    # The playbook engine this runtime walks, and the block catalogue it resolves
    # steps against. Blocks themselves are never imported here.
    "manta-blocks",
    # Pinned to the Prefect server's version: this process talks to its API.
    "prefect==3.8.3",
    # Prefect's result storage on the object store, which is how a block's output
    # record travels from its container back to the orchestrator. Both sides need
    # it: the block container writes, the orchestrator reads.
    "prefect-aws>=0.5",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
# Only what creates and drains the docker work pool needs this: the one-shot
# provisioner and the worker. Block containers never import it, which is what
# lets the execution image stay a thin layer on the bare blocks image.
docker = ["prefect-docker>=0.6"]

[tool.uv.sources]
manta-blocks = { path = "../manta-blocks", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manta_runtime"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Same rules as the backend, minus its FastAPI-specific exception. The lower
# target-version follows requires-python above.
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "N"]

[tool.ruff.lint.per-file-ignores]
# S101: bare `assert` is how pytest expresses assertions.
# S105/S106: test fixtures spell out fake credentials on purpose.
"tests/**" = ["S101", "S105", "S106"]
