[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playbook"
version = "0.1.0"
description = "Composable units of energy-model work (blocks) and the playbooks that chain them together."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Bryn Pickering", email = "bryn.pickering@openenergytransition.org" },
    { name = "Jonas Hörsch", email = "jonas.hoersch@openenergytransition.org" }
]
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

# Deliberately absent: anything orchestration-related, and any modelling framework.
# Running a block is a plain method call here; what schedules that call, and what a
# block does when it runs, both live outside this package.
[project.optional-dependencies]
# For records that live in S3-compatible object storage (see playbook/blocks/storage.py).
s3 = ["boto3>=1.34"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/playbook"]
exclude = ["**/tests"]

[tool.pytest.ini_options]
testpaths = ["src"]

# Matches the backend's rules (see CONTRIBUTING.md); the lower target-version follows
# requires-python above, which is set by the interpreters block libraries run on.
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "N"]

[tool.ruff.lint.per-file-ignores]
# S101: bare `assert` is how pytest expresses assertions.
"**/tests/**" = ["S101"]
# F401: an `__init__.py` re-exports names without using them.
"__init__.py" = ["F401"]
